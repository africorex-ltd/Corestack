name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version PR + tags
  pull-requests: write # version PR
  id-token: write # npm provenance

jobs:
  release:
    name: Changesets version / publish
    runs-on: ubuntu-latest
    # CI is the ONLY publish path (docs/engineering/09-release-versioning.md §1).
    # NPM_TOKEN is a granular automation token; org requires 2FA + provenance.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
