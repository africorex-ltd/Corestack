name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are SHA-pinned (AUD-04); Renovate keeps digests current (pinDigests).

jobs:
  verify:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:versions
      # CI truth guards (AUD-01): a lane that runs nothing must not pass.
      - run: node tooling/scripts/assert-turbo-tasks.mjs test --min 3
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    # No fixed `services:` container: suites in the manifest below use
    # Testcontainers, which starts its own ephemeral Postgres per test file
    # via the runner's Docker daemon (present by default on ubuntu-latest) —
    # a static service block + DATABASE_URL would be dead configuration no
    # test actually reads (exactly the AUD-01 class of silent-drift risk).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The matched-suite set must EXACTLY equal the versioned manifest
      # (AUD-01): zero-vs-zero passes explicitly; drift in either direction fails.
      - run: node tooling/scripts/assert-turbo-tasks.mjs test:integration --manifest tooling/ci/integration-manifest.json
      - run: pnpm test:integration
