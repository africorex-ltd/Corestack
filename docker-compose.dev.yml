# CoreStack local development stack.
# Day one needs exactly one service:      docker compose -f docker-compose.dev.yml up -d
# Full stack (mail, object storage, redis): add  --profile full
# The app itself runs on the host (pnpm) — this file is infrastructure only;
# the reference-app Dockerfile arrives with M4 (blueprint E17-T11).

name: corestack-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corestack
      POSTGRES_PASSWORD: corestack
      POSTGRES_DB: corestack_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corestack"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailcatcher:
    profiles: [full]
    image: sj26/mailcatcher:v0.10.0
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP

  minio:
    profiles: [full]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: corestack
      MINIO_ROOT_PASSWORD: corestack-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  redis:
    profiles: [full]
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  miniodata:
